[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avocado"
version = "0.1.0"
description = "A tiny avocado package"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "crisio" }]

[project.scripts]
avocado = "avocado.cli:main"

[tool.setuptools]
packages = ["avocado"]
