name: Estadísticas (usuarios y comidas)

# Solo números agregados (api/scripts/stats.mjs sin --detalle): el repo es público y estos registros también.
# Para ver quién se registró: `npm run stats -- --detalle` con credenciales de Cloudflare, fuera de CI.
on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci

      - name: Consultar la base de datos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run stats
