name: Borrar fotos de R2

# Borra fotos sueltas del bucket (p. ej. de comidas borradas a mano en la base de datos).
# Recibe las llaves separadas por espacio: "<usuario>/<comida>.jpg". Son ids, no datos personales.
on:
  workflow_dispatch:
    inputs:
      keys:
        description: Llaves de las fotos, separadas por espacio
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Borrar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEYS: ${{ inputs.keys }}
        run: |
          for key in $KEYS; do
            case "$key" in
              */*.jpg|*/*.png|*/*.webp) ;;
              *) echo "::error::Llave inválida: $key"; exit 1 ;;
            esac
            npx wrangler r2 object delete "avocado-photos/$key" --remote
          done
